name: ci

env:
  # Pinado de propósito: nativeapi 0.5.10 (última) usa Isolate.create, que não
  # existe no Flutter 3.50+. Suba a versão junto com o nativeapi.
  FLUTTER_VERSION: 3.47.9

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libx11-dev libxi-dev liblzma-dev libnotify-dev ninja-build cmake clang pkg-config

      - name: versions
        shell: bash
        run: |
          dart --version
          flutter --version

      - name: pub get models
        shell: bash
        run: |
          set -e
          cd packages/models
          dart pub get

      - name: pub get core
        shell: bash
        run: |
          set -e
          cd packages/core
          dart pub get

      - name: pub get cli
        shell: bash
        run: |
          set -e
          cd packages/cli
          dart pub get

      - name: pub get app
        shell: bash
        run: |
          set -e
          cd app
          flutter pub get

      - name: analyze models
        shell: bash
        run: |
          set -e
          cd packages/models
          dart analyze

      - name: analyze core
        shell: bash
        run: |
          set -e
          cd packages/core
          dart analyze

      - name: analyze cli
        shell: bash
        run: |
          set -e
          cd packages/cli
          dart analyze

      - name: format
        shell: bash
        run: |
          set -e
          for d in packages/models packages/core packages/cli app; do
            (cd "$d" && dart format --output=none --set-exit-if-changed lib test)
          done
          dart format --output=none --set-exit-if-changed tool

      - name: analyze app
        shell: bash
        run: |
          set -e
          cd app
          dart analyze lib test

      - name: test models
        shell: bash
        run: |
          set -e
          cd packages/models
          dart test

      - name: test core
        shell: bash
        run: |
          set -e
          cd packages/core
          dart test

      - name: test cli
        shell: bash
        run: |
          set -e
          cd packages/cli
          dart test

      - name: test app
        shell: bash
        run: |
          set -e
          cd app
          flutter test

  build-macos:
    name: build macOS .app
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: (cd app && flutter pub get && flutter build macos --release)
      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            app/build/macos/Build/Products/Release/quota_deck.app \
            quota_deck-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-macos
          path: quota_deck-macos.zip
          retention-days: 7

  build-windows:
    name: build Windows .exe
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: cd app; flutter pub get; flutter build windows --release
      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=${{ github.workspace }}\app\build\windows\x64\runner\Release" `
            "installer\quota_deck.iss"
      - name: Package .exe
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath quota_deck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-windows
          path: quota_deck-windows.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-windows-installer
          path: dist-installer/*.exe
          retention-days: 7

  build-linux:
    name: build Linux bundle
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libx11-dev libxi-dev liblzma-dev libnotify-dev ninja-build cmake clang pkg-config
      - run: (cd app && flutter pub get && flutter build linux --release)
      - name: Package bundle
        run: |
          tar -czf quota_deck-linux.tar.gz \
            -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-linux
          path: quota_deck-linux.tar.gz
          retention-days: 7

  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Conferir tag x pubspec
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag != app/pubspec.yaml $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List assets
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: QuotaDeck ${{ github.ref_name }}
          generate_release_notes: true
          # macOS fica de fora: sem notarização o Gatekeeper bloqueia o app
          # baixado. O build continua no CI como artefato para os mantenedores.
          files: |
            artifacts/quota_deck-windows/quota_deck-windows.zip
            artifacts/quota_deck-windows-installer/*.exe
            artifacts/quota_deck-linux/quota_deck-linux.tar.gz
