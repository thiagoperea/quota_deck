name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libx11-dev libxi-dev liblzma-dev ninja-build cmake clang pkg-config

      - name: versions
        shell: bash
        run: |
          dart --version
          flutter --version

      - name: pub get models
        shell: bash
        run: |
          set -e
          cd packages/models
          dart pub get

      - name: pub get core
        shell: bash
        run: |
          set -e
          cd packages/core
          dart pub get

      - name: pub get cli
        shell: bash
        run: |
          set -e
          cd packages/cli
          dart pub get

      - name: pub get app
        shell: bash
        run: |
          set -e
          cd app
          flutter pub get

      - name: analyze
        run: |
          (cd packages/models && dart analyze)
          (cd packages/core && dart analyze)
          (cd packages/cli && dart analyze)
          (cd app && dart analyze lib test)

      - name: test
        run: |
          (cd packages/models && dart test)
          (cd packages/core && dart test)
          (cd packages/cli && dart test)
          (cd app && flutter test)

  build-macos:
    name: build macOS .app
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: (cd app && flutter pub get && flutter build macos --release)
      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            app/build/macos/Build/Products/Release/quota_deck.app \
            quota_deck-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-macos
          path: quota_deck-macos.zip
          retention-days: 7

  build-windows:
    name: build Windows .exe
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd app; flutter pub get; flutter build windows --release
      - name: Package .exe
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath quota_deck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-windows
          path: quota_deck-windows.zip
          retention-days: 7

  build-linux:
    name: build Linux bundle
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libx11-dev libxi-dev liblzma-dev ninja-build cmake clang pkg-config
      - run: (cd app && flutter pub get && flutter build linux --release)
      - name: Package bundle
        run: |
          tar -czf quota_deck-linux.tar.gz \
            -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: quota_deck-linux
          path: quota_deck-linux.tar.gz
          retention-days: 7
