name: quota_deck
description: "QuotaDeck — painel local-first dos limites de uso dos provedores de IA."
publish_to: 'none'
version: 0.7.1+10

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  quota_deck_models:
    path: ../packages/models
  quota_deck_core:
    path: ../packages/core
  provider: ^6.1.5+1
  intl: ^0.20.2
  tray_manager: ^0.8.3
  window_manager: ^0.6.0
  ffi: ^2.2.0
  flutter_svg: ^2.3.2
  nativeapi: ^0.5.10
  nativeapi_flutter: ^0.5.10
  local_notifier: ^0.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/providers/
